<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CCXP26 • Guia Quinta-feira (03/12)</title>
  <style>
    :root {
      --bg-page: #F4F6F9;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F8FAFC;
      --bg-chip: #F1F5F9;
      --border-light: #E2E8F0;
      --border-medium: #CBD5E1;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --text-muted: #64748B;
      --primary: #1D4ED8;
      --primary-hover: #1E40AF;
      --accent-amber: #D97706;
      --star-gold: #F59E0B;
      --success: #15803D;
      --danger: #B91C1C;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-primary);
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 32px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      line-height: 1.45;
    }

    /* Cabeçalho fixo no topo com respiro */
    header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-light);
      padding: 18px 16px 14px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .header-tag {
      color: var(--accent-amber);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .header-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .header-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn {
      border: none;
      border-radius: 8px; 
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--primary);
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-ghost {
      background-color: var(--bg-chip);
      color: var(--text-secondary);
      border: 1px solid var(--border-medium);
    }

    .btn-ghost:hover {
      background-color: #E2E8F0;
    }

    /* Barra de busca */
    .search-box {
      position: relative;
      margin-bottom: 12px;
    }

    .search-input {
      width: 100%;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-medium);
      border-radius: 10px;
      padding: 11px 38px 11px 14px;
      font-size: 14px;
      color: var(--text-primary);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
      background-color: #FFFFFF;
    }

    .clear-search {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      padding: 4px 6px;
      display: none;
    }

    /* Filtros */
    .filtros {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }

    .chip {
      background-color: var(--bg-chip);
      color: var(--text-secondary);
      border: 1px solid var(--border-medium);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .chip.ativo {
      background-color: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
      font-weight: 700;
    }

    /* Barra de status */
    main {
      padding: 12px 16px 24px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .status-count {
      font-weight: 700;
      color: var(--text-secondary);
    }

    /* Cards */
    .lista-cards {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px
