<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CCXP26 • Guia Quinta-feira (03/12)</title>
  <style>
    :root,
    :root[data-theme="light"] {
      color-scheme: light;
      --bg-page: #F4F6F9;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F8FAFC;
      --bg-chip: #F1F5F9;
      --border-light: #E2E8F0;
      --border-medium: #CBD5E1;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --text-muted: #64748B;
      --primary: #1D4ED8;
      --primary-hover: #1E40AF;
      --badge-bg: #EFF6FF;
      --badge-border: #BFDBFE;
      --badge-text: #1D4ED8;
      --accent-amber: #D97706;
      --star-inactive: #CBD5E1;
      --star-gold: #F59E0B;
      --success: #15803D;
      --danger: #B91C1C;
      --danger-bg: #FEE2E2;
      --shadow-header: 0 2px 6px rgba(15, 23, 42, 0.04);
      --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.05);
      --overlay-bg: rgba(15, 23, 42, 0.5);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg-page: #0B1120;
      --bg-surface: #1E293B;
      --bg-subtle: #0F172A;
      --bg-chip: #0F172A;
      --border-light: #334155;
      --border-medium: #475569;
      --text-primary: #F8FAFC;
      --text-secondary: #CBD5E1;
      --text-muted: #94A3B8;
      --primary: #3B82F6;
      --primary-hover: #2563EB;
      --badge-bg: #172554;
      --badge-border: #1E40AF;
      --badge-text: #93C5FD;
      --accent-amber: #FACC15;
      --star-inactive: #475569;
      --star-gold: #FACC15;
      --success: #22C55E;
      --danger: #FCA5A5;
      --danger-bg: #450A0A;
      --shadow-header: 0 2px 8px rgba(0, 0, 0, 0.35);
      --shadow-card: 0 2px 6px rgba(0, 0, 0, 0.25);
      --overlay-bg: rgba(2, 6, 23, 0.78);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-primary);
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 32px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      line-height: 1.45;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-light);
      padding: 18px 16px 14px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-header);
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .header-tag {
      color: var(--accent-amber);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .header-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .header-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 9px 13px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--primary);
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-ghost {
      background-color: var(--bg-chip);
      color: var(--text-secondary);
      border: 1px solid var(--border-medium);
    }

    .btn-ghost:hover {
      border-color: var(--text-muted);
    }

    .search-box {
      position: relative;
      margin-bottom: 12px;
    }

    .search-input {
      width: 100%;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-medium);
      border-radius: 10px;
      padding: 11px 38px 11px 14px;
      font-size: 14px;
      color: var(--text-primary);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
      background-color: var(--bg-surface);
    }

    .clear-search {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      padding: 4px 6px;
      display: none;
    }

    .filtros {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }

    .chip {
      background-color: var(--bg-chip);
      color: var(--text-secondary);
      border: 1px solid var(--border-medium);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .chip.ativo {
      background-color: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
      font-weight: 700;
    }

    main {
      padding: 12px 16px 24px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .status-count {
      font-weight: 700;
      color: var(--text-secondary);
    }

    .lista-cards {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 16px;
      box-shadow: var(--shadow-card);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .badge {
      background-color: var(--badge-bg);
      color: var(--badge-text);
      border: 1px solid var(--badge-border);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-edit {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-medium);
      border-radius: 6px;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
    }

    .btn-edit:hover {
      border-color: var(--text-muted);
    }

    .btn-star {
      background: none;
      border: none;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      color: var(--star-inactive);
      padding: 2px 4px;
    }

    .btn-star.ativo {
      color: var(--star-gold);
    }

    .card-nome {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .card-obras {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
      margin-bottom: 10px;
    }

    .info-box {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 13px;
    }

    .info-label {
      font-weight: 700;
      color: var(--text-secondary);
    }

    .card-obs {
      margin-top: 8px;
      font-size: 12px;
      font-style: italic;
      color: var(--text-muted);
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      background-color: var(--bg-surface);
      border: 1px dashed var(--border-medium);
      border-radius: 12px;
    }

    .empty-state h3 {
      font-size: 16px;
      margin-bottom: 6px;
    }

    .empty-state p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background-color: var(--overlay-bg);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
    }

    .modal-overlay.aberto {
      display: flex;
    }

    .modal-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: 14px;
      width: 100%;
      max-width: 480px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .modal-body {
      overflow-y: auto;
      padding-right: 4px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }

    .form-control {
      width: 100%;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-medium);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      color: var(--text-primary);
      outline: none;
    }

    .form-control:focus {
      border-color: var(--primary);
      background-color: var(--bg-surface);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 68px;
    }

    .modal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border-light);
    }

    .modal-footer-right {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    .btn-save {
      background-color: var(--success);
      color: #FFFFFF;
    }

    .btn-danger {
      background-color: var(--danger-bg);
      color: var(--danger);
    }
  </style>
</head>
<body>

  <header>
    <div class="container">
      <div class="header-top">
        <div>
          <div class="header-tag">Guia Rápido • 03 Dez 2026</div>
          <h1 class="header-title">CCXP26 • Quinta-feira</h1>
          <div class="header-sub">São Paulo Expo • 12h às 21h</div>
        </div>
        <div class="header-actions">
          <button class="btn btn-ghost" id="btnTema" title="Alternar entre tema claro e escuro">🌙 Escuro</button>
          <button class="btn btn-ghost" id="btnResetar" title="Restaurar dados originais">Restaurar</button>
          <button class="btn btn-primary" id="btnNovo">+ Adicionar</button>
        </div>
      </div>

      <div class="search-box">
        <input
          type="text"
          id="inputBusca"
          class="search-input"
          placeholder="Buscar artista, obra (ex: Batman), palco ou mesa..."
        />
        <button class="clear-search" id="btnLimparBusca" title="Limpar busca">✕</button>
      </div>

      <div class="filtros" id="containerFiltros"></div>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="status-bar">
        <span class="status-count" id="textoContador">Exibindo 0 registros</span>
        <span>Salvo automaticamente no navegador • Toque em "Editar" para atualizar</span>
      </div>

      <div class="lista-cards" id="listaCards"></div>
    </div>
  </main>

  <!-- Modal Adicionar / Editar -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <h2 class="modal-title" id="modalTitulo">Novo Participante (03/12)</h2>

      <div class="modal-body">
        <div class="form-group">
          <label for="campoNome">Nome do Artista / Atração *</label>
          <input type="text" id="campoNome" class="form-control" placeholder="Ex: Shintaro Kago" />
        </div>

        <div class="form-group">
          <label for="campoCategoria">Categoria</label>
          <select id="campoCategoria" class="form-control">
            <option value="Quadrinista">Quadrinista</option>
            <option value="Colorista">Colorista</option>
            <option value="Roteirista">Roteirista</option>
            <option value="Ator">Ator</option>
            <option value="Palcos">Palcos</option>
          </select>
        </div>

        <div class="form-group">
          <label for="campoLocal">Local / Mesa / Palco</label>
          <input type="text" id="campoLocal" class="form-control" placeholder="Ex: Artists' Valley - Mesa A12" />
        </div>

        <div class="form-group">
          <label for="campoHorario">Horário / Turno</label>
          <input type="text" id="campoHorario" class="form-control" placeholder="Ex: 14h00 às 17h00" />
        </div>

        <div class="form-group">
          <label for="campoObras">Obras / Destaques</label>
          <input type="text" id="campoObras" class="form-control" placeholder="Ex: Homem-Aranha, Batman..." />
        </div>

        <div class="form-group">
          <label for="campoObs">Observações</label>
          <textarea id="campoObs" class="form-control" placeholder="Ex: Senhas distribuídas 30 min antes"></textarea>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-danger" id="btnExcluir" style="display: none;">Excluir</button>
        <div class="modal-footer-right">
          <button class="btn btn-ghost" id="btnCancelar">Cancelar</button>
          <button class="btn btn-save" id="btnSalvar">Salvar</button>
        </div>
      </div>
    </div>
  </div>

    // Elementos DOM
    const elBtnTema = document.getElementById('btnTema');

    // Tema Light / Dark
    function carregarTema() {
      try {
        const salvo = localStorage.getItem(THEME_KEY);
        if (salvo === 'dark' || salvo === 'light') return salvo;
      } catch (e) {
        console.warn('Erro ao ler tema:', e);
      }
      return 'light';
    }

    let temaAtual = carregarTema();

    function aplicarTema(tema) {
      temaAtual = tema === 'dark' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', temaAtual);
      elBtnTema.textContent = temaAtual === 'dark' ? '☀️ Claro' : '🌙 Escuro';
      try {
        localStorage.setItem(THEME_KEY, temaAtual);
      } catch (e) {
        console.warn('Erro ao salvar tema:', e);
      }
    }

    function alternarTema() {
      aplicarTema(temaAtual === 'dark' ? 'light' : 'dark');
    }

    // Persistência dos participantes
    function carregarDados() {
      try {
        const salvo = localStorage.getItem(STORAGE_KEY);
        if (salvo) {
          const parsed = JSON.parse(salvo);
          if (Array.isArray(parsed) && parsed.length > 0) {
            return parsed;
          }
        }
      } catch (e) {
        console.warn('Erro ao ler localStorage:', e);
      }
      return structuredClone(DADOS_INICIAIS);
    }

    function salvarDados() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(participantes));
      } catch (e) {
        console.warn('Erro ao salvar no localStorage:', e);
      }
    }

    let participantes = carregarDados();
    let categoriaAtiva = 'Todos';
    let termoBusca = '';
    let idEditando = null;

    function renderizarFiltros() {
      elFiltros.innerHTML = '';
      CATEGORIAS.forEach((cat) => {
        const btn = document.createElement('button');
        btn.className = 'chip' + (categoriaAtiva === cat ? ' ativo' : '');
        btn.textContent = cat;
        btn.onclick = () => {
          categoriaAtiva = cat;
          renderizarFiltros();
          renderizarLista();
        };
        elFiltros.appendChild(btn);
      });
    }

    function escaparHTML(texto) {
      const div = document.createElement('div');
      div.textContent = texto || '';
      return div.innerHTML;
    }

    function renderizarLista() {
      const termo = termoBusca.toLowerCase().trim();

      const filtrados = participantes.filter((item) => {
        const okCategoria =
          categoriaAtiva === 'Todos'
            ? true
            : categoriaAtiva === 'Favoritos'
            ? item.favorito
            : item.categoria === categoriaAtiva;

        const okBusca =
          termo === '' ||
          item.nome.toLowerCase().includes(termo) ||
          item.obras.toLowerCase().includes(termo) ||
          item.local.toLowerCase().includes(termo) ||
          item.categoria.toLowerCase().includes(termo);

        return okCategoria && okBusca;
      });

      elContador.textContent = `Exibindo ${filtrados.length} de ${participantes.length} registros`;

      if (filtrados.length === 0) {
        elLista.innerHTML = `
          <div class="empty-state">
            <h3>Nenhum participante encontrado</h3>
            <p>Tente limpar o filtro de busca ou clique em "+ Adicionar" para cadastrar um artista.</p>
          </div>
        `;
        return;
      }

      elLista.innerHTML = filtrados
        .map(
          (item) => `
          <article class="card">
            <div class="card-header">
              <span class="badge">${escaparHTML(item.categoria)}</span>
              <div class="card-actions">
                <button class="btn-edit" onclick="abrirModalEditar('${item.id}')">Editar</button>
                <button
                  class="btn-star ${item.favorito ? 'ativo' : ''}"
                  onclick="alternarFavorito('${item.id}')"
                  title="Favoritar"
                >
                  ${item.favorito ? '★' : '☆'}
                </button>
              </div>
            </div>

            <h2 class="card-nome">${escaparHTML(item.nome)}</h2>
            <p class="card-obras"><strong>Obras / Tema:</strong> ${escaparHTML(item.obras)}</p>

            <div class="info-box">
              <div><span class="info-label">📍 Local:</span> ${escaparHTML(item.local)}</div>
              <div><span class="info-label">⏰ Horário:</span> ${escaparHTML(item.horario)}</div>
            </div>

            ${item.observacao ? `<p class="card-obs">${escaparHTML(item.observacao)}</p>` : ''}
          </article>
        `
        )
        .join('');
    }

    window.alternarFavorito = function (id) {
      participantes = participantes.map((item) =>
        item.id === id ? { ...item, favorito: !item.favorito } : item
      );
      salvarDados();
      renderizarLista();
    };

    window.abrirModalEditar = function (id) {
      const item = participantes.find((p) => p.id === id);
      if (!item) return;

      idEditando = id;
      elModalTitulo.textContent = 'Atualizar Participante / Horário';
      elCampoNome.value = item.nome;
      elCampoCategoria.value = item.categoria;
      elCampoLocal.value = item.local;
      elCampoHorario.value = item.horario;
      elCampoObras.value = item.obras;
      elCampoObs.value = item.observacao || '';
      elBtnExcluir.style.display = 'inline-block';
      elModal.classList.add('aberto');
    };

    function abrirModalNovo() {
      idEditando = null;
      elModalTitulo.textContent = 'Novo Participante (03/12)';
      elCampoNome.value = '';
      elCampoCategoria.value = 'Quadrinista';
      elCampoLocal.value = "Artists' Valley - Mesa ";
      elCampoHorario.value = '14h00 às 16h00';
      elCampoObras.value = '';
      elCampoObs.value = '';
      elBtnExcluir.style.display = 'none';
      elModal.classList.add('aberto');
    }

    function fecharModal() {
      elModal.classList.remove('aberto');
    }

    function salvarFormulario() {
      const nome = elCampoNome.value.trim();
      if (!nome) {
        alert('Informe o nome do participante ou atração.');
        elCampoNome.focus();
        return;
      }

      const dados = {
        nome,
        categoria: elCampoCategoria.value,
        local: elCampoLocal.value.trim() || "Artists' Valley",
        horario: elCampoHorario.value.trim() || 'A confirmar',
        obras: elCampoObras.value.trim() || 'Não especificado',
        observacao: elCampoObs.value.trim(),
      };

      if (idEditando) {
        participantes = participantes.map((p) =>
          p.id === idEditando ? { ...p, ...dados } : p
        );
      } else {
        participantes.unshift({
          id: String(Date.now()),
          ...dados,
          favorito: true,
        });
      }

      salvarDados();
      fecharModal();
      renderizarLista();
    }

    function excluirParticipante() {
      if (!idEditando) return;
      if (confirm('Deseja remover este registro da sua lista?')) {
        participantes = participantes.filter((p) => p.id !== idEditando);
        salvarDados();
        fecharModal();
        renderizarLista();
      }
    }

    function restaurarPadrao() {
      if (confirm('Isso apagará suas edições locais e restaurará a lista original. Continuar?')) {
        participantes = structuredClone(DADOS_INICIAIS);
        salvarDados();
        renderizarLista();
      }
    }

    elBusca.addEventListener('input', (e) => {
      termoBusca = e.target.value;
      elLimparBusca.style.display = termoBusca.length > 0 ? 'block' : 'none';
      renderizarLista();
    });

    elLimparBusca.addEventListener('click', () => {
      termoBusca = '';
      elBusca.value = '';
      elLimparBusca.style.display = 'none';
      renderizarLista();
    });

    elBtnTema.addEventListener('click', alternarTema);
    document.getElementById('btnNovo').addEventListener('click', abrirModalNovo);
    document.getElementById('btnCancelar').addEventListener('click', fecharModal);
    document.getElementById('btnSalvar').addEventListener('click', salvarFormulario);
    document.getElementById('btnExcluir').addEventListener('click', excluirParticipante);
    document.getElementById('btnResetar').addEventListener('click', restaurarPadrao);

    elModal.addEventListener('click', (e) => {
      if (e.target === elModal) fecharModal();
    });

    aplicarTema(temaAtual);
    renderizarFiltros();
    renderizarLista();
  </script>
</body>
</html>
